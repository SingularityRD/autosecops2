# .github/workflows/release.yml
#
# AutoSecOps release pipeline (WP W4.7). Runs when a v* tag is pushed to the
# canonical repository SingularityRD/autosecops2; every job is skipped in forks.
#
#   version         tagged commit is on main; tag <-> VERSION <-> release notes
#                   checks (fails before any build)
#   build-images    backend, daemon, agent -> ghcr.io/singularityrd/autosecops-<c>
#                   (linux/amd64 + linux/arm64, pushed and recorded by digest)
#   build-web       the web console as a static bundle (the same SPA the backend
#                   image serves) -> autosecops-<V>-web.tar.gz
#   sbom            CycloneDX SBOMs: Python + Node from the lockfiles (offline,
#                   same code as scripts/release/dry-run.sh) and every image
#                   platform (syft); images.json with index + platform digests
#   smoke-test      the pushed images start and answer their health checks
#   desktop-resources  schema SQL for the desktop app, copied out of the pushed
#                   backend image (clients/desktop/scripts/prepare-standalone.js)
#   desktop         desktop installers on matching runners: macOS dmg (arm64,
#                   x64), Linux AppImage (x64), Windows NSIS (x64). Developer ID
#                   signing + notarization (macOS) and Authenticode (Windows)
#                   only when the repository secrets are set; otherwise the
#                   files are named *-unsigned.*. The cosign signature and
#                   SHA256SUMS of the sign job cover them either way, and the
#                   sbom job's autosecops-<V>-node-desktop.cdx.json is their SBOM.
#   sign            keyless cosign (OIDC token; see github-attestations) signatures on
#                   every image digest, CycloneDX SBOM + SLSA v1 provenance
#                   attestations attached to the images, a Sigstore bundle per
#                   release file, SHA256SUMS + its bundle, the Sigstore trusted root
#   github-attestations  optional (vars.RELEASE_GITHUB_ATTESTATIONS == 'true'):
#                   GitHub artifact attestations; the only other job with an OIDC
#                   token, and the only one with `attestations: write`
#   update-release  DRAFT GitHub Release with the signed files and release notes
#
# A person publishes the draft after the GA decision (VERSIONING.md, "Release
# tags"). Customer verification, also offline / air-gapped:
# docs/release/dogrulama.md and scripts/release/verify-release.sh.
#
# Every action is pinned to a full commit SHA (the comment names the tag).

name: Release

on:
  push:
    tags:
      - "v*"

# Nothing by default; each job asks for exactly what it uses.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/singularityrd/autosecops
  COSIGN_VERSION: v3.0.6
  SYFT_VERSION: v1.33.0

jobs:
  # ---------------------------------------------------------------------------
  version:
    name: Resolve and check version
    if: github.repository == 'SingularityRD/autosecops2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      notes: ${{ steps.v.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check-notes reads the merge history
          persist-credentials: false

      # A v* tag on a commit that never reached main (a feature branch, a
      # fork's commit pushed by someone with tag rights) must not release.
      # The tag ruleset (VERSIONING.md, "Tag protection") limits who can
      # create v* tags; this check limits what they can point at.
      - name: Tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          # check-on-main and check-notes need the full history; release_tool
          # refuses a shallow clone, so unshallow if the checkout was shallow.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git -c "http.extraheader=AUTHORIZATION: basic ${auth}" fetch --unshallow --no-tags origin
          fi
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags \
            origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/release/release_tool.py check-on-main \
            --commit "$GITHUB_SHA" --main refs/remotes/origin/main

      - name: Tag, version files and release notes agree
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          python3 scripts/release/release_tool.py check-tag --tag "$TAG" --github-output "$GITHUB_OUTPUT"
          python3 scripts/release/release_tool.py check-versions
          base="${TAG#v}"
          base="${base%%-*}"
          notes="docs/release/${base}.md"
          # --data: the notes and the CHANGELOG block must be exactly what
          # render-notes produces from this commit's merge history.
          python3 scripts/release/release_tool.py check-notes --notes "$notes" --strict \
            --data "docs/release/${base}.json"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  build-images:
    name: Build ${{ matrix.component }} image
    if: github.repository == 'SingularityRD/autosecops2'
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push to ghcr.io
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: backend
            dockerfile: infra/docker/Dockerfile.backend
            description: AutoSecOps API and bundled web console
          - component: daemon
            dockerfile: infra/docker/Dockerfile.daemon
            description: AutoSecOps headless SOC daemon
          - component: agent
            dockerfile: infra/docker/Dockerfile.agent
            description: AutoSecOps TypeScript agent (queue worker and chat server)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=autosecops-${{ matrix.component }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=SingularityRD
            org.opencontainers.image.source=https://github.com/SingularityRD/autosecops2
            org.opencontainers.image.licenses=Apache-2.0

      - name: Read the Python pin
        id: pin
        run: echo "version=$(tr -d '[:space:]' < .python-version)" >> "$GITHUB_OUTPUT"

      # No layer cache on release builds: a cache written by another ref must
      # not end up inside a signed image.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          no-cache: true
          provenance: false # SLSA provenance is attached by cosign in the sign job
          sbom: false # SBOMs come from the sbom job
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VIGIL_VERSION=${{ needs.version.outputs.version }}
            PYTHON_VERSION=${{ steps.pin.outputs.version }}
          platforms: linux/amd64,linux/arm64

      - name: Record digest and index
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -eu
          case "$DIGEST" in sha256:*) ;; *) echo "::error::no digest from build-push"; exit 1 ;; esac
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${COMPONENT}"
          docker buildx imagetools inspect --raw "${IMAGE_PREFIX}-${COMPONENT}@${DIGEST}" \
            > "digests/${COMPONENT}.index.json"
          # Platform manifests too: images.json records each config digest,
          # which survives docker save/load on an air-gapped site.
          jq -r '.manifests[] | select(.platform.os != "unknown") | .digest' \
            "digests/${COMPONENT}.index.json" | while read -r d; do
            docker buildx imagetools inspect --raw "${IMAGE_PREFIX}-${COMPONENT}@${d}" \
              > "digests/${COMPONENT}.${d#sha256:}.json"
          done

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.component }}
          path: digests/
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  build-web:
    name: Build web console bundle
    if: github.repository == 'SingularityRD/autosecops2'
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Node major as the web-builder stage of Dockerfile.backend. No
      # dependency cache, for the same reason as the image builds.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Build and package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          (cd clients/web && npm ci --no-audit --no-fund && npm run build)
          mkdir -p dist
          epoch=$(git log -1 --format=%ct)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${epoch}" \
            -C clients/web -cf - build | gzip -n > "dist/autosecops-${VERSION}-web.tar.gz"

      - name: Upload web bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  sbom:
    name: Generate SBOMs
    if: github.repository == 'SingularityRD/autosecops2'
    needs: [version, build-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # syft pulls the pushed images
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image list with index and platform digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          python3 scripts/release/release_tool.py images-manifest \
            --version "$VERSION" --prefix "$IMAGE_PREFIX" --digests digests \
            --out "dist/autosecops-${VERSION}-images.json"

      # Same code path as the local dry run; no network.
      - name: Lockfile SBOMs (Python, Node)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            python3 scripts/release/release_tool.py sboms --out dist --version "$VERSION"

      - name: Image SBOMs (one per platform)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -eu
          python3 scripts/release/release_tool.py image-refs --images "dist/autosecops-${VERSION}-images.json" > refs.tsv
          while IFS="$(printf '\t')" read -r component arch ref; do
            out="dist/autosecops-${VERSION}-image-${component}-${arch}.cdx.json"
            "$SYFT" scan "registry:${ref}" -o "cyclonedx-json=${out}"
            python3 scripts/release/release_tool.py validate-sbom "$out"
          done < refs.tsv

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Backend and daemon run their default command and must answer the image
  # HEALTHCHECK URL; the agent loads both entry points. Pulled by digest.
  smoke-test:
    name: Smoke test images
    if: github.repository == 'SingularityRD/autosecops2'
    needs: [version, build-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend and daemon answer their health checks
        run: |
          set -eu
          probe() { # component port path
            image="${IMAGE_PREFIX}-$1@$(cat "digests/$1")"
            if [ "$1" = backend ]; then
              cid=$(docker run -d -e DEV_MODE=true -e DATABASE_URL=postgresql://x:x@localhost/x \
                -e REDIS_URL=redis://localhost:6379 "$image")
            else
              cid=$(docker run -d -e DEV_MODE=true "$image")
            fi
            i=0
            while [ "$i" -lt 90 ]; do
              i=$((i + 1))
              if [ -z "$(docker ps -q --filter "id=$cid")" ]; then break; fi
              if docker exec "$cid" curl -fsS --max-time 2 "http://localhost:$2$3" >/dev/null 2>&1; then
                echo "$1 ok"
                docker rm -f "$cid" >/dev/null
                return 0
              fi
              sleep 1
            done
            echo "::error::$1 exited or did not answer GET $3 on $2"
            docker logs "$cid" || true
            docker rm -f "$cid" >/dev/null 2>&1 || true
            return 1
          }
          probe backend 6987 /api/health
          probe daemon 9091 /health

      - name: Backend ships the web console
        run: |
          docker run --rm "${IMAGE_PREFIX}-backend@$(cat digests/backend)" \
            test -f /app/clients/web/build/index.html \
            || { echo "::error::web console missing from the backend image"; exit 1; }

      - name: Agent entry points load
        run: |
          docker run --rm "${IMAGE_PREFIX}-agent@$(cat digests/agent)" \
            node --input-type=module -e "
              await import('/app/dist/worker.js');
              await import('/app/dist/serve.js');
              console.log('agent ok');
            "

  # ---------------------------------------------------------------------------
  # The desktop app ships the schema SQL of the backend image it runs, copied
  # out of the image this run pushed (never from the working tree), so the pair
  # matches by construction. Linux only: the macOS and Windows runners have no
  # Docker daemon.
  desktop-resources:
    name: Stage desktop app resources
    if: github.repository == 'SingularityRD/autosecops2'
    needs: [version, build-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pull the pushed backend image
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Schema SQL and gateway config from the released backend image
        env:
          AUTOSECOPS_DESKTOP_VERSION: ${{ needs.version.outputs.version }}
        run: node clients/desktop/scripts/prepare-standalone.js

      - name: Upload staged resources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-desktop
          path: |
            clients/desktop/standalone/db-init/
            clients/desktop/standalone/bifrost-config.json
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Installers per OS. The signing secrets are human-provided (VERSIONING.md,
  # "Release tags", step 5); each platform's build step
  # sees only its own, through electron-builder's standard variables:
  #   macOS    CSC_LINK, CSC_KEY_PASSWORD (Developer ID Application .p12, base64)
  #            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
  #   Windows  WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD (Authenticode .pfx, base64)
  # A macOS certificate without the notarization trio fails the job rather than
  # ship a signed but unnotarized dmg. No dependency cache, as for the images.
  desktop:
    name: Build desktop app (${{ matrix.platform }})
    if: github.repository == 'SingularityRD/autosecops2'
    needs: [version, desktop-resources]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: mac
            runner: macos-15
          - platform: linux
            runner: ubuntu-24.04
          - platform: win
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Electron 44 needs Node >= 22.12.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Download staged resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-desktop
          path: clients/desktop/standalone

      # Only whether each secret is set reaches the shell, never its value.
      - name: Which signing material is configured
        id: signing
        env:
          PLATFORM: ${{ matrix.platform }}
          HAS_MAC_CERT: ${{ secrets.CSC_LINK != '' }}
          HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          HAS_WIN_CERT: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          set -eu
          signed=false
          case "$PLATFORM" in
            mac)
              if [ "$HAS_MAC_CERT" = true ]; then
                if [ "$HAS_NOTARY" != true ]; then
                  echo "::error::CSC_LINK is set but APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are not; refusing to ship a signed but unnotarized dmg"
                  exit 1
                fi
                signed=true
              fi ;;
            win) [ "$HAS_WIN_CERT" = true ] && signed=true ;;
            linux) signed=false ;; # AppImage has no OS signature; cosign + SHA256SUMS cover it
          esac
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "desktop $PLATFORM: OS code signing $signed"

      - name: Build installers
        working-directory: clients/desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          # Without a certificate, keep electron-builder from picking up any
          # identity from the runner keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed == 'true' && 'true' || 'false' }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          set -eu
          npm ci --no-audit --no-fund
          npm test
          # The app version is the release version (2.0.0-rc.1 on an rc tag),
          # which is also the image tag main.ts asks Docker for.
          npx electron-builder --config electron-builder.yml "--${PLATFORM}" --publish never \
            -c.extraMetadata.version="$VERSION"

      - name: Collect and label installers
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          mkdir -p dist
          n=0
          for f in clients/desktop/release/autosecops-"${VERSION}"-desktop-*; do
            case "$f" in *.dmg|*.AppImage|*.exe) ;; *) continue ;; esac
            name=$(basename "$f")
            if [ "$SIGNED" != true ] && [ "$PLATFORM" != linux ]; then
              name="${name%.*}-unsigned.${name##*.}"
            fi
            cp "$f" "dist/$name"
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "::error::no installers built"; exit 1; }
          ls -l dist

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-installer-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # The only job that can mint an OIDC token. Keyless signatures bind every
  # artifact to this workflow at this tag: Fulcio certificate identity
  # https://github.com/SingularityRD/autosecops2/.github/workflows/release.yml@refs/tags/<tag>,
  # issuer https://token.actions.githubusercontent.com.
  sign:
    name: Sign, attest and checksum
    if: github.repository == 'SingularityRD/autosecops2'
    needs: [version, build-images, build-web, sbom, smoke-test, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # cosign stores signatures and attestations next to the images
      id-token: write # keyless signing (Fulcio)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist

      - name: Download web bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: dist

      # Signed and checksummed below like every other release file.
      - name: Download desktop installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-installer-*
          path: dist
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Provenance predicates
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          python3 scripts/release/release_tool.py image-refs --index \
            --images "dist/autosecops-${VERSION}-images.json" > index.tsv
          while IFS="$(printf '\t')" read -r component _ ref; do
            python3 scripts/release/release_tool.py provenance \
              --subject-name "${ref%@*}" --subject-digest "${ref#*@}" \
              --out "dist/autosecops-${VERSION}-image-${component}.provenance.json"
          done < index.tsv

      - name: Sign images, attach SBOM and provenance attestations
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          images="dist/autosecops-${VERSION}-images.json"
          # Index digest: signature + SLSA provenance.
          while IFS="$(printf '\t')" read -r component _ ref; do
            base="dist/autosecops-${VERSION}-image-${component}"
            cosign sign --yes --bundle "${base}.sig.sigstore.json" "$ref"
            cosign attest --yes --type slsaprovenance1 \
              --predicate "${base}.provenance.json" \
              --bundle "${base}.provenance.att.sigstore.json" "$ref"
          done < index.tsv
          # Every platform manifest: signature + its own CycloneDX SBOM.
          python3 scripts/release/release_tool.py image-refs --images "$images" > platforms.tsv
          while IFS="$(printf '\t')" read -r component arch ref; do
            base="dist/autosecops-${VERSION}-image-${component}-${arch}"
            cosign sign --yes --bundle "${base}.sig.sigstore.json" "$ref"
            cosign attest --yes --type cyclonedx \
              --predicate "${base}.cdx.json" \
              --bundle "${base}.sbom.att.sigstore.json" "$ref"
          done < platforms.tsv

      - name: Sign every release file, then SHA256SUMS
        run: |
          set -eu
          cp scripts/release/verify-release.sh dist/verify-release.sh
          for f in dist/*; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          python3 scripts/release/release_tool.py checksums --dir dist
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      # The Sigstore public-good trusted root as of this release, for offline
      # verification. A convenience copy, not a trust anchor: customers compare
      # it with an independently fetched one (docs/release/dogrulama.md).
      - name: Sigstore trusted root
        run: |
          set -eu
          cosign initialize
          root=$(find "$HOME/.sigstore" -name trusted_root.json -type f | head -n 1)
          if [ -z "$root" ]; then
            echo "::error::cosign initialize did not cache trusted_root.json"
            exit 1
          fi
          cp "$root" dist/trusted_root.json

      - name: Self-check with the customer script
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sh scripts/release/verify-release.sh --dir dist --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" --trusted-root dist/trusted_root.json

      - name: Upload signed release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Optional GitHub artifact attestations (gh attestation verify). Private
  # repositories need GitHub Enterprise Cloud for these, so they are opt-in
  # through the repository variable RELEASE_GITHUB_ATTESTATIONS=true. A separate
  # job so that `attestations: write` is granted only when the option is on;
  # the cosign signatures and attestations of the sign job do not depend on it.
  github-attestations:
    name: GitHub attestations (optional)
    if: github.repository == 'SingularityRD/autosecops2' && vars.RELEASE_GITHUB_ATTESTATIONS == 'true'
    needs: [version, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push-to-registry stores the attestation next to the image
      id-token: write # attest-build-provenance signs with the workflow identity
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: dist

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Provenance attestation (release files)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Image digests
        id: digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          python3 scripts/release/release_tool.py image-refs --index \
            --images "dist/autosecops-${VERSION}-images.json" > index.tsv
          while IFS="$(printf '\t')" read -r component _ ref; do
            echo "${component}=${ref#*@}" >> "$GITHUB_OUTPUT"
          done < index.tsv

      - name: Provenance attestation (backend)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-backend
          subject-digest: ${{ steps.digests.outputs.backend }}
          push-to-registry: true

      - name: Provenance attestation (daemon)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-daemon
          subject-digest: ${{ steps.digests.outputs.daemon }}
          push-to-registry: true

      - name: Provenance attestation (agent)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-agent
          subject-digest: ${{ steps.digests.outputs.agent }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # Draft release with the signed files and the notes. Publishing it is a
  # human step after the GA decision.
  update-release:
    name: Draft GitHub Release
    if: github.repository == 'SingularityRD/autosecops2'
    needs: [version, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its files
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: dist

      # The support tool is outside the signed set; it carries its own .sha256
      # (docs/release/dogrulama.md).
      - name: Build support tarball
        run: scripts/build-support-tarball.sh "${{ needs.version.outputs.version }}" support-dist

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          name: AutoSecOps ${{ needs.version.outputs.version }}
          body_path: ${{ needs.version.outputs.notes }}
          fail_on_unmatched_files: true
          files: |
            dist/*
            support-dist/vigil-support-${{ needs.version.outputs.version }}.tar.gz
            support-dist/vigil-support-${{ needs.version.outputs.version }}.tar.gz.sha256
