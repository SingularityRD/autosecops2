# Standalone stack: every service runs from a published image, so the app needs
# no source tree, venv, Python or Node — only Docker. Mirrors
# infra/docker/docker-compose.yml minus the build: contexts and the dev-only services.
#
# Its own project name and unnamed containers keep it isolated from a dev stack
# (project "docker", containers deeptempo-*) so both can coexist on one machine.
# Only the backend publishes a port; everything else stays on the internal
# network, which is what keeps the default postgres password unreachable.
name: vigil

# Both agent processes take the same environment (see x-agent-env in
# infra/docker/docker-compose.yml): a URL that drifts between them is a run that
# behaves differently depending on which process picked it up.
x-agent-env: &agent-env
  - POSTGRES_HOST=postgres
  - POSTGRES_PORT=5432
  - POSTGRES_DB=deeptempo_soc
  - POSTGRES_USER=vigil_app
  - POSTGRES_PASSWORD=deeptempo_secure_password_change_me
  - REDIS_URL=redis://redis:6379/0
  # Each defaults to localhost:6987, which is the agent container itself here.
  - VIGIL_PLAYBOOKS_URL=http://backend:6987/internal/playbooks
  - VIGIL_PRICING_URL=http://backend:6987/internal/pricing
  - VIGIL_RUNS_URL=http://backend:6987/internal/runs
  - VIGIL_TOOLS_URL=http://backend:6987/internal/tools/invoke
  # Same secret the backend checks; empty means every /internal call is a 503.
  - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:?set by the desktop app}
  - BIFROST_URL=http://bifrost:8080

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deeptempo_soc
      POSTGRES_USER: deeptempo
      POSTGRES_PASSWORD: deeptempo_secure_password_change_me
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Must run here, not just in db-seed: the extensions have to exist before
      # the backend's create_all (its indexes use pg_trgm's gin_trgm_ops), and
      # the auth tables have to be created by this SQL — with the DEFAULT
      # clauses create_all does not emit — or seeding the admin row fails on
      # the columns it omits. 00_apply.sh explains why it isn't plain *.sql.
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./db-init:/db-init:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeptempo -d deeptempo_soc"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vigil

  redis:
    # 7.2.x is the last BSD-3-Clause Redis line (7.4+ is RSALv2/SSPL); pinned by
    # index digest, same as the Helm chart and CI (NOTICE, W0.38).
    image: redis:7.2.16-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
    volumes:
      - redis_data:/data
    # infra/helm/vigil/files/redis-start.sh, inlined ($$ is Compose's escape for
    # $): plain redis-server through the image's entrypoint, except that Redis
    # 7.4 data (unreadable by the pinned 7.2) is moved aside first (W0.38).
    command:
      - sh
      - -c
      - |
        # Redis start wrapper (W0.38). Redis 7.4 (the old floating redis:7-alpine)
        # writes RDB format 12, which the pinned BSD 7.2 cannot read: it would refuse to
        # start. Such data is moved aside (kept, so a rollback can use it) and Redis
        # starts empty, with revocation_epoch set before any client can connect: the
        # API rejects every token issued before it, because the logouts and cutoffs
        # Redis held are gone. Otherwise this is plain `redis-server "$$@"`.
        # $$0 is how to start the server: docker-entrypoint.sh (Compose: the image's
        # entrypoint drops to the redis user, as before) or redis-server (Helm, whose
        # `command` replaces the entrypoint, as before). Kept identical in the Helm
        # chart and both Compose files (tests/unit/_ratchets/test_licences_and_pins.py).
        launch() {
          if [ "$$0" = docker-entrypoint.sh ]; then docker-entrypoint.sh redis-server "$$@"; else redis-server "$$@"; fi
        }
        old=""
        for f in /data/dump.rdb /data/appendonlydir/*.base.rdb; do
          [ -f "$$f" ] || continue
          v=$$(head -c 9 "$$f" | sed -n 's/^REDIS0*\([0-9][0-9]*\)$$/\1/p')
          if [ -n "$$v" ] && [ "$$v" -gt 11 ]; then old=1; fi
        done
        if [ -n "$$old" ]; then
          keep="/data/redis-7.4-data-$$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$$keep"
          for p in /data/dump.rdb /data/appendonlydir; do
            if [ -e "$$p" ]; then mv "$$p" "$$keep/"; fi
          done
          echo "autosecops: Redis 7.4 data moved to $$keep; starting empty. Queued jobs and sessions start over; every earlier login is revoked." >&2
          sock=/tmp/redis-epoch.sock
          launch "$$@" --port 0 --unixsocket "$$sock" --requirepass "" &
          pid=$$!
          until redis-cli -s "$$sock" ping >/dev/null 2>&1; do
            kill -0 "$$pid" 2>/dev/null || exit 1
            sleep 1
          done
          redis-cli -s "$$sock" set revocation_epoch "$$(date +%s)" >/dev/null
          redis-cli -s "$$sock" shutdown save >/dev/null 2>&1
          wait "$$pid"
        fi
        if [ "$$0" = docker-entrypoint.sh ]; then exec docker-entrypoint.sh redis-server "$$@"; fi
        exec redis-server "$$@"
      - docker-entrypoint.sh
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vigil

  bifrost:
    # Pinned to match infra/docker/docker-compose.yml; see the note there before bumping.
    image: maximhq/bifrost:${BIFROST_IMAGE_TAG:-v2.2.1}
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      # The file is the bootstrap; the volume is where Bifrost keeps what it was
      # told at runtime. The app runs `compose down` on quit, so without it every
      # UI change (keys, virtual keys, budgets) lasted until the next quit.
      - bifrost_data:/app/data
      - ./bifrost-config.json:/app/data/config.json:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # wget --spider does HEAD and Bifrost /health only answers GET (405 on HEAD).
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Host Ollama: implicit on Docker Desktop, required on native Linux Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vigil

  backend:
    image: ghcr.io/singularityrd/autosecops-backend:${VIGIL_VERSION}
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=deeptempo_soc
      - POSTGRES_USER=vigil_app
      - POSTGRES_PASSWORD=deeptempo_secure_password_change_me
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - BIFROST_URL=http://bifrost:8080
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      # Auth stays on (DEV_MODE defaults to false in the image). The app mints
      # this per install and persists it; the backend fails closed without it.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set by the desktop app}
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:?set by the desktop app}
      # core/config.py defaults to localhost:6989, which is nothing here.
      - AGENT_URL=http://agent-serve:6989
    ports:
      - "127.0.0.1:6987:6987"
    volumes:
      # Must track HOME in Dockerfile.backend, or every UI-configured key dies
      # on restart. The image pre-creates the dir owned by 1000:1000 so a fresh
      # named volume inherits that; a volume from before #701 does not, and has
      # to be recreated.
      - vigil_home:/home/vigil/.vigil
    # logs/ is workdir-relative and /app is root-owned, so tmpfs is the only
    # mount that can carry the right owner. Keep uid/gid in step with
    # Dockerfile.backend.
    tmpfs:
      - /app/logs:uid=1000,gid=1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bifrost:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vigil

  # Agent layer: one image, two commands. The worker drains BullMQ `agent-runs`;
  # serve answers AGENT_URL. Neither publishes a port — the private network plus
  # the bearer token is what keeps them off the host.
  agent-worker:
    image: ghcr.io/singularityrd/autosecops-agent:${VIGIL_VERSION}
    command: ["node", "dist/worker.js"]
    environment: *agent-env
    healthcheck:
      # 6990 is probes only; Node 20 has global fetch, so no curl in the image.
      test: ["CMD", "node", "-e", "fetch('http://localhost:6990/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vigil

  agent-serve:
    image: ghcr.io/singularityrd/autosecops-agent:${VIGIL_VERSION}
    command: ["node", "dist/serve.js"]
    environment: *agent-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6989/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # An SSE stream can sit on one model call for minutes.
    stop_grace_period: 120s
    # Postgres only: serve never touches the queue.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vigil

  # Second pass over the same files, once the backend's create_all has built the
  # tables the data-only scripts need. Behind a profile so `up` ignores it; the
  # app runs it with `compose run`. A healthy backend only means /api/health
  # answers and create_all may still be running, so wait for a table only it
  # creates — its DDL is one transaction, so that sentinel implies the rest.
  db-seed:
    profiles:
      - seed
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: deeptempo
      PGDATABASE: deeptempo_soc
      PGPASSWORD: deeptempo_secure_password_change_me
    volumes:
      - ./db-init:/db-init:ro
      - ./initdb/00_apply.sh:/apply.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - >
        for i in $$(seq 1 60); do
          [ "$$(psql -tAc "SELECT to_regclass('public.sla_policies') IS NOT NULL")" = t ] && break;
          sleep 1;
        done;
        exec sh /apply.sh
    restart: "no"
    networks:
      - vigil

volumes:
  postgres_data:
  redis_data:
  vigil_home:
  bifrost_data:

networks:
  vigil:
