{{- if .Values.daemon.enabled }}
{{- /*
Only one daemon may run the loops — the orchestrator holds in-memory state
(work queues, agent tracking) that is not safe to share. The replica count is
not a value: with daemon.leaderElection.enabled the StatefulSet runs exactly 2
pods (a leader and a hot standby, chosen by a Postgres advisory lock; see
services/daemon/leadership.py), otherwise exactly 1.
*/ -}}
{{- $ha := .Values.daemon.leaderElection.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vigil.daemon.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "daemon") | nindent 4 }}
spec:
  serviceName: {{ include "vigil.daemon.fullname" . }}
  replicas: {{ if $ha }}2{{ else }}1{{ end }}
  {{- /* Parallel: a standby is created (and recreated) without waiting on the
         other pod; the lock, not pod ordering, decides who leads. */}}
  podManagementPolicy: {{ if $ha }}Parallel{{ else }}OrderedReady{{ end }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "daemon") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vigil.componentLabels" (dict "context" . "component" "daemon") | nindent 8 }}
        {{- with .Values.daemon.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.daemon.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "vigil.serviceAccountName" . }}
      {{- include "vigil.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: daemon
          image: {{ include "vigil.image" (dict "context" . "component" "daemon") | quote }}
          imagePullPolicy: {{ include "vigil.imagePullPolicy" (dict "context" . "component" "daemon") }}
          ports:
            - name: webhook
              containerPort: {{ .Values.daemon.ports.webhook }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.daemon.ports.metrics }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.daemon.ports.health }}
              protocol: TCP
          envFrom:
            {{- include "vigil.signingKeyEnvFrom" (dict "context" . "key" "AUDIT_CHECKPOINT_SIGNING_KEY") | nindent 12 }}
            {{- include "vigil.envFrom" . | nindent 12 }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vigil.postgres.passwordSecret" . }}
                  key: {{ include "vigil.postgres.passwordSecretKey" . }}
            {{- include "vigil.env" . | nindent 12 }}
            {{- include "vigil.stateEnv" . | nindent 12 }}
            {{- include "vigil.caBundleEnv" . | nindent 12 }}
            {{- if .Values.daemon.persistence.enabled }}
            # W0.12 ingest spool on the pod's own volume; only the leader
            # opens (and replays) it.
            - name: DAEMON_INGEST_SPOOL_DIR
              value: {{ printf "%s/.ingest-spool" .Values.daemon.persistence.mountPath | quote }}
            {{- end }}
            - name: DAEMON_LEADER_ELECTION_ENABLED
              value: {{ $ha | toString | quote }}
            {{- if $ha }}
            - name: DAEMON_LEADER_LEASE_SECONDS
              value: {{ .Values.daemon.leaderElection.leaseSeconds | toString | quote }}
            - name: DAEMON_LEADER_RETRY_SECONDS
              value: {{ .Values.daemon.leaderElection.retrySeconds | toString | quote }}
            {{- end }}
            {{- with .Values.daemon.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Probes target /health on port 9091. /metrics on 9090 only serves
          # when VIGIL_OTEL_ENABLED=true, so it's unsafe for readiness.
          # Gate liveness/readiness on a slow first boot (orchestrator + agent
          # warmup, MCP connection retries) so a slow start can't trip the
          # liveness kill-restart loop before the daemon serves /health. While
          # this probe runs, liveness AND readiness are suppressed; it allows up
          # to failureThreshold * periodSeconds = 300s for first serve.
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.daemon.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "vigil.stateVolumeMount" . | nindent 12 }}
            {{- if .Values.evidence.persistence.enabled }}
            {{- include "vigil.evidenceVolumeMount" . | nindent 12 }}
            {{- end }}
            {{- include "vigil.caBundleVolumeMount" . | nindent 12 }}
            {{- if .Values.daemon.persistence.enabled }}
            - name: investigations
              mountPath: {{ .Values.daemon.persistence.mountPath }}
            {{- end }}
      volumes:
        {{- include "vigil.stateVolume" . | nindent 8 }}
        {{- if .Values.evidence.persistence.enabled }}
        {{- include "vigil.evidenceVolume" . | nindent 8 }}
        {{- end }}
        {{- include "vigil.caBundleVolume" . | nindent 8 }}
      {{- with .Values.daemon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.daemon.affinity }}
      affinity:
        {{- toYaml .Values.daemon.affinity | nindent 8 }}
      {{- else if $ha }}
      # Leader and standby on different nodes when the cluster allows it, so
      # one node loss does not take both.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "daemon") | nindent 20 }}
      {{- end }}
      {{- with .Values.daemon.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.daemon.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: investigations
      spec:
        accessModes:
          {{- toYaml .Values.daemon.persistence.accessModes | nindent 10 }}
        {{- if .Values.daemon.persistence.storageClassName }}
        storageClassName: {{ .Values.daemon.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.daemon.persistence.size }}
  {{- end }}
{{- end }}
