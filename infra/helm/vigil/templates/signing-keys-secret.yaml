{{- if and .Values.signingKeys.generate (not .Values.signingKeys.existingSecret) }}
{{- /*
W0.36: the two Ed25519 signing keys, minted at install so a fresh release signs
its audit checkpoints (daemon) and evidence packs (backend) from the first day.
An Ed25519 private key is any 32 random bytes, so randBytes 32 (base64) is the
seed core/audit/checkpoint.py and core/compliance/evidence_bundle.py read.
One Secret per key, so each workload is handed only the key it signs with.
Each key is kept on every upgrade by reading it back, and on `helm uninstall`
by the resource policy: replacing one would orphan what it signed. The values
never pass through values.yaml and are never printed. Where lookup can't run
(helm template, Argo CD, Flux) each render mints new keys: set
signingKeys.existingSecret there instead.
*/}}
{{- range $key := list "AUDIT_CHECKPOINT_SIGNING_KEY" "EVIDENCE_PACK_SIGNING_KEY" }}
{{- $name := include "vigil.signingKeys.secretName" (dict "context" $ "key" $key) }}
{{- $old := lookup "v1" "Secret" $.Release.Namespace $name }}
{{- $value := "" }}
{{- if and $old $old.data (hasKey $old.data $key) }}
{{- $value = index $old.data $key | b64dec }}
{{- end }}
{{- if not $value }}
{{- $value = randBytes 32 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vigil.labels" $ | nindent 4 }}
    app.kubernetes.io/component: signing-keys
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value | b64enc }}
{{- end }}
{{- end }}
