{{- /*
The chart's own LLM stack (W0.55): Bifrost, the one LLM egress (ADR 0011), and
Ollama, the local model server. Both off by default; see values.llmStack. The
air-gap installer applies infra/airgap/k8s/llm-stack.yaml instead.
*/ -}}
{{- $s := .Values.llmStack }}
{{- $ollamaUrl := .Values.config.OLLAMA_URL }}
{{- if $s.ollama.enabled }}
{{- $ollamaUrl = printf "http://%s:11434" (include "vigil.ollama.fullname" .) }}
{{- end }}
{{- if $s.bifrost.enabled }}
{{- $net := dict "default_request_timeout_in_seconds" 1800 "stream_idle_timeout_in_seconds" 300 "max_retries" 0 }}
{{- $providers := dict }}
{{- if $s.bifrost.providerKeysSecret }}
{{- range $s.bifrost.providers }}
{{- $env := printf "%s_API_KEY" (upper .) }}
{{- $key := dict "name" (printf "default-%s-key" .) "weight" 1 "value" (printf "env.%s" $env) "models" (list "*") }}
{{- $_ := set $providers . (dict "network_config" $net "keys" (list $key)) }}
{{- end }}
{{- end }}
{{- if or $s.ollama.enabled $ollamaUrl }}
{{- $onet := merge (dict "allow_private_network" true) $net }}
{{- $okey := dict "name" "default-ollama-url" "weight" 1 "ollama_key_config" (dict "url" "env.OLLAMA_URL") "models" (list "*") }}
{{- $_ := set $providers "ollama" (dict "network_config" $onet "keys" (list $okey)) }}
{{- end }}
{{- $seed := dict "client" (dict "enable_logging" true "disable_content_logging" false) "logs_store" (dict "enabled" true "type" "sqlite" "config" (dict "path" "/app/data/logs.db")) "providers" $providers }}
{{- /* Bifrost v2 fetches its pricing and model-parameter catalogs from
       getbifrost.ai at start-up and exits without them (W0.61). Offline (or
       with egress kept in-cluster) it reads empty catalogs from the seed. */ -}}
{{- $offline := or $s.bifrost.offlineCatalog (.Values.networkPolicies.egress).inClusterOnly }}
{{- if $offline }}
{{- $_ := set $seed "framework" (dict "pricing" (dict "pricing_url" "file:///app/seed/pricing.json" "model_parameters_url" "file:///app/seed/model-parameters.json" "pricing_sync_interval" 86400)) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vigil.bifrost.fullname" . }}-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "bifrost") | nindent 4 }}
data:
  # First-boot seed only; Bifrost keeps what it is told later on its volume.
  config.json: |
    {{- toPrettyJson $seed | nindent 4 }}
  {{- if $offline }}
  pricing.json: "{}"
  model-parameters.json: "{}"
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vigil.bifrost.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "bifrost") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $s.bifrost.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $s.bifrost.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vigil.bifrost.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "bifrost") | nindent 4 }}
spec:
  # One writer for the sqlite config and log store on a ReadWriteOnce volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "bifrost") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vigil.componentLabels" (dict "context" . "component" "bifrost") | nindent 8 }}
      annotations:
        checksum/seed: {{ toJson $seed | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- include "vigil.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "vigil.podSecurityContext" (dict "context" . "sc" .Values.podSecurityContext) | nindent 8 }}
      containers:
        - name: bifrost
          image: "{{ $s.bifrost.image.repository }}:{{ $s.bifrost.image.tag }}"
          imagePullPolicy: {{ $s.bifrost.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OLLAMA_URL
              value: {{ $ollamaUrl | quote }}
          {{- with $s.bifrost.providerKeysSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
                optional: true
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: seed
              mountPath: /app/data/config.json
              subPath: config.json
              readOnly: true
            {{- if $offline }}
            - name: seed
              mountPath: /app/seed
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml $s.bifrost.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "vigil.bifrost.fullname" . }}-data
        - name: seed
          configMap:
            name: {{ include "vigil.bifrost.fullname" . }}-seed
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vigil.bifrost.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "bifrost") | nindent 4 }}
spec:
  selector:
    {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "bifrost") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
{{- end }}
{{- if $s.ollama.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vigil.ollama.fullname" . }}-models
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "ollama") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $s.ollama.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $s.ollama.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vigil.ollama.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "ollama") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "ollama") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vigil.componentLabels" (dict "context" . "component" "ollama") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "vigil.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "vigil.podSecurityContext" (dict "context" . "sc" .Values.podSecurityContext) | nindent 8 }}
      {{- with $s.ollama.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.ollama.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ollama
          image: "{{ $s.ollama.image.repository }}:{{ $s.ollama.image.tag }}"
          imagePullPolicy: {{ $s.ollama.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # The image defaults to root's home; run unprivileged with the
            # identity key and the models on the volume.
            - name: HOME
              value: /models
            - name: OLLAMA_MODELS
              value: /models/models
            - name: OLLAMA_NOPRUNE
              value: "1"
          volumeMounts:
            - name: models
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml $s.ollama.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "vigil.ollama.fullname" . }}-models
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vigil.ollama.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "ollama") | nindent 4 }}
spec:
  selector:
    {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "ollama") | nindent 4 }}
  ports:
    - name: http
      port: 11434
      targetPort: http
{{- end }}
