{{- if and .Values.dataKey.generate (not .Values.dataKey.existingSecret) }}
{{- /*
W0.34: the data-encryption key (VIGIL_DATA_KEY), minted at install so a fresh
release (SECRETS_BACKEND=database, DEV_MODE=false) starts without anyone
setting secrets.dataEncryptionKey. It encrypts the MFA secrets and the
platform_secrets rows, so it is kept on every upgrade (read back with lookup)
and on `helm uninstall` (resource policy): a new key would make every stored
secret unreadable. core/crypto/data_key.py stretches any string of 32+
characters with HKDF. Where lookup can't run (helm template, Argo CD, Flux) each
render would mint a new key: set dataKey.existingSecret (or
secrets.dataEncryptionKey) there instead.
*/}}
{{- $name := include "vigil.dataKey.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := "" }}
{{- if and $old $old.data (hasKey $old.data "VIGIL_DATA_KEY") }}
{{- $value = index $old.data "VIGIL_DATA_KEY" | b64dec }}
{{- end }}
{{- if not $value }}
{{- $value = randAlphaNum 64 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-key
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  VIGIL_DATA_KEY: {{ $value | b64enc }}
{{- end }}
