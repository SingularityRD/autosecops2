apiVersion: v2
name: vigil
description: AutoSecOps — AI-assisted Security Operations Center with human approval
type: application
version: 2.0.0
appVersion: 2.0.0
kubeVersion: '>=1.25.0-0'
home: https://github.com/SingularityRD/autosecops2
sources:
  - https://github.com/SingularityRD/autosecops2
maintainers:
  - name: SingularityRD
    url: https://github.com/SingularityRD
keywords:
  - security
  - soc
  - siem
  - ai
  - claude
  - anthropic
  - mcp
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
dependencies:
  - name: postgresql
    version: 16.2.2
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.bitnami.enabled
    import-values:
      - child: auth
        parent: postgresql.bitnami.auth
  - name: redis
    version: 20.3.0
    repository: https://charts.bitnami.com/bitnami
    condition: redis.bitnami.enabled
  - name: opentelemetry-collector
    version: 0.108.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: otelCollector.enabled
    alias: otelCollector
