# Default values for the AutoSecOps Helm chart (chart name: vigil, kept so
# existing releases upgrade in place).
# This is a YAML-formatted file.
# See README.md next to this file and docs/guide/yonetici-kilavuzu.md.

# -----------------------------------------------------------------------------
# Global
# -----------------------------------------------------------------------------
global:
  # Registry and namespace of the AutoSecOps images. Images resolve to
  # <registry>/<namespace>-<component>, e.g.
  # ghcr.io/singularityrd/autosecops-backend: the names .github/workflows/
  # release.yml publishes (IMAGE_PREFIX). tests/unit/airgap checks they agree.
  imageRegistry: ghcr.io
  imageNamespace: singularityrd/autosecops
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# Override chart name or fullname if the release name collides with something.
nameOverride: ""
fullnameOverride: ""

# Common labels applied to every resource.
commonLabels: {}

# -----------------------------------------------------------------------------
# Backend API (FastAPI, serves REST API + bundled SPA)
# -----------------------------------------------------------------------------
backend:
  replicaCount: 2
  image:
    # Final image ref: {{ global.imageRegistry }}/{{ global.imageNamespace }}-backend:{{ tag }}
    repository: ""   # empty → auto-derive from global.imageNamespace + "-backend"
    tag: ""          # empty → fall back to .Chart.AppVersion
    pullPolicy: ""   # empty → inherit global.imagePullPolicy
  service:
    type: ClusterIP
    port: 6987
  # Resource requests/limits tuned for a small prod deploy; scale up for real workloads.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # CPU-based HPA. For queue-depth-based scaling, see follow-up issues.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Extra env merged on top of the shared ConfigMap/Secret. Useful for overrides.
  extraEnv: []
  # Backend-specific feature flags written into the ConfigMap.
  env:
    BIND_HOST: "0.0.0.0"

# -----------------------------------------------------------------------------
# SOC Daemon (autonomous orchestrator; one leader, optional hot standby)
# -----------------------------------------------------------------------------
daemon:
  enabled: true
  # Hot standby (docs/operations/rpo-rto.md). With enabled=true the StatefulSet
  # runs 2 pods; a Postgres advisory lock picks the leader, which runs every
  # loop, and the other waits (healthy, "role": "standby"; its webhook answers
  # 503 + Retry-After). A killed leader is replaced within ~retrySeconds, a
  # frozen or partitioned one within leaseSeconds + retrySeconds. Needs
  # PostgreSQL 14+. enabled=false: a single pod, as before.
  leaderElection:
    enabled: true
    leaseSeconds: 15
    retrySeconds: 2
  image:
    repository: ""   # empty → auto-derive from global.imageNamespace + "-daemon"
    tag: ""
    pullPolicy: ""
  # Ports (explicit; matches env.example defaults)
  ports:
    webhook: 8081
    metrics: 9090   # Prometheus /metrics (OTEL PrometheusReader, only when OTEL enabled)
    health: 9091    # always-on /health and /status
  service:
    type: ClusterIP
  # Syslog listener (W0.41): CEF, LEEF, FortiGate key=value and Wazuh JSON
  # alerts. Off by default. Syslog has no credential, so only senders in
  # allowedSources (CIDRs) are read, and with the list empty every sender is
  # refused; the NetworkPolicy (when enabled) opens the ports to the same
  # CIDRs. tls.existingSecret names a Secret with tls.crt and tls.key (and
  # ca.crt for mutual TLS with tls.clientCA: true). With leader election only
  # the leader listens: a sender reaching the standby is refused and must
  # reconnect (rsyslog and syslog-ng do). Relays that forward over HTTP can
  # use POST /ingest/syslog on the webhook port instead.
  syslog:
    enabled: false
    tcpPort: 5514
    udpPort: 0          # 0: no UDP (lossy, spoofable)
    allowedSources: []
    tls:
      existingSecret: ""
      clientCA: false
    service:
      # Syslog senders are usually outside the cluster: LoadBalancer or
      # NodePort to reach them. Kept separate from the daemon Service.
      type: ClusterIP
      annotations: {}
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  persistence:
    # Daemon writes investigation artifacts under ORCHESTRATOR_WORKDIR (data/investigations).
    # Enabled by default so singleton restarts don't lose in-flight state.
    # The ingest spool (W0.12) lives on this per-pod volume too, in
    # <mountPath>/.ingest-spool: findings the webhook acknowledged survive a
    # pod restart or reschedule. Disabled: the spool falls back to the state
    # directory (emptyDir by default: survives container restarts only).
    enabled: true
    size: 10Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    mountPath: /app/data/investigations
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# -----------------------------------------------------------------------------
# LLM Worker (ARQ worker, processes Claude requests off Redis queue)
# -----------------------------------------------------------------------------
llmWorker:
  enabled: true
  replicaCount: 2
  # Shares the backend image — command is overridden to run services.worker.
  image:
    repository: ""   # inherits backend.image.repository when empty
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  autoscaling:
    # CPU-based HPA (classic). Mutually exclusive with keda.enabled.
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    # KEDA ScaledObject (issue #116) — scales on actual Redis queue depth.
    # Requires KEDA installed in the cluster (https://keda.sh).
    keda:
      enabled: false
      minReplicas: 2
      maxReplicas: 20
      # Seconds of zero queue activity before scaling down. Keep high to avoid
      # thrash when the queue is bursty.
      cooldownPeriod: 300
      # How often KEDA polls Redis for the queue depth.
      pollingInterval: 15
      # ARQ default queue name for the AutoSecOps llm-worker (see core/llm/gateway/gateway.py).
      queueName: "arq:llm"
      # KEDA scales one replica per listLength items queued.
      listLength: "5"
      # Only used when redis.enabled=false AND redis.bitnami.enabled=false.
      # host:port form without scheme or password.
      redisAddress: ""
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# -----------------------------------------------------------------------------
# Agent worker — the TypeScript BullMQ consumer. Runs alongside llmWorker, not
# instead of it; see agent-worker-deployment.yaml for what has to go first.
# -----------------------------------------------------------------------------
agentWorker:
  enabled: true
  replicaCount: 2
  # Its own Node image — unlike llmWorker it cannot share the backend's.
  image:
    repository: ""   # defaults to <registry>/<namespace>-agent
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    # CPU-based HPA (classic). Mutually exclusive with keda.enabled.
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    # KEDA ScaledObject — scales on actual Redis queue depth.
    # Requires KEDA installed in the cluster (https://keda.sh).
    keda:
      enabled: false
      # Must be >= 1: nothing promotes BullMQ's delayed jobs into the waiting
      # list except a running worker. The template clamps it.
      minReplicas: 2
      maxReplicas: 20
      # Seconds of zero queue activity before scaling down. Keep high to avoid
      # thrash when the queue is bursty.
      cooldownPeriod: 300
      # How often KEDA polls Redis for the queue depth.
      pollingInterval: 15
      # BullMQ's waiting list for RUN_QUEUE (services/agent/contracts/job.ts).
      # Not "agent-runs": that is the queue name, not the Redis key.
      queueName: "bull:agent-runs:wait"
      # KEDA scales one replica per listLength items queued.
      listLength: "5"
      # Only used when redis.enabled=false AND redis.bitnami.enabled=false.
      # host:port form without scheme or password.
      redisAddress: ""
      # Empty means the database the chart's own Redis is addressed on. Set it only
      # alongside redis.external.url, to whatever database that URL names -- a
      # scaler counting the wrong one reads an empty queue and never scales up.
      databaseIndex: ""
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# -----------------------------------------------------------------------------
# Agent serve — the same image as agentWorker, running the other entry point:
# chat over SSE and the run projections a supervisor reads. Separate from the
# worker because the two scale on unrelated signals (#635).
# -----------------------------------------------------------------------------
agentServe:
  enabled: true
  replicaCount: 2
  image:
    repository: ""   # defaults to <registry>/<namespace>-agent, same as agentWorker
    tag: ""
    pullPolicy: ""
  service:
    # The backend reaches this at AGENT_URL, computed from the Service name.
    port: 6989
  # An SSE stream can sit on one model call for minutes, and dropping it loses
  # the conversation rather than retrying it. Long enough for a turn to finish.
  terminationGracePeriodSeconds: 120
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # No autoscaling block, and its absence is the decision. This process holds SSE
  # streams open for minutes, so an idle-looking box may be carrying hundreds of
  # live conversations -- CPU reads near zero and an HPA would scale it down
  # mid-answer. Separate replica counts satisfy #635's "scale independently"
  # honestly; concurrent connections is the signal that would work, and that is a
  # metrics-pipeline project. Left out rather than shipped as `enabled: false`,
  # which would render no HPA and quietly scale to one when somebody turned it on.
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# -----------------------------------------------------------------------------
# In-chart Postgres (set postgresql.enabled=false to use an external DB)
# -----------------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: deeptempo_soc
    username: deeptempo
    # Password sourced from secrets.postgresPassword unless existingSecret is set.
    existingSecret: ""        # name of a pre-created Secret containing POSTGRES_PASSWORD
    existingSecretKey: POSTGRES_PASSWORD
  service:
    port: 5432
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 4Gi
  # External Postgres (used when postgresql.enabled=false)
  external:
    host: ""
    port: 5432
    database: deeptempo_soc
    username: deeptempo
    # Either set .existingSecret + .existingSecretKey OR provide password via secrets.postgresPassword.
    existingSecret: ""
    existingSecretKey: POSTGRES_PASSWORD
    # Unused: Helm injects discrete POSTGRES_* vars, not a DSN. Require SSL with
    # POSTGRES_SSL_MODE=require via extraConfig / extraEnv.
    sslRequired: false

  # Bitnami postgresql subchart (issue #114). When enabled, the MVP in-chart
  # StatefulSet above is suppressed and all Bitnami values below are passed
  # through to the subchart (alias: bitnamiPostgresql in Chart.yaml).
  #
  # Prerequisites (ONE-TIME):
  #   helm dependency update infra/helm/vigil
  #
  # See https://artifacthub.io/packages/helm/bitnami/postgresql for the full
  # value schema — anything you add here flows through unchanged.
  bitnami:
    enabled: false
    # If set, overrides the subchart's default service/secret name
    # (<release>-postgresql). Rarely needed.
    fullnameOverride: ""
    auth:
      database: deeptempo_soc
      username: deeptempo
      # Leave empty to let the subchart generate a password into its Secret.
      # Set to a pre-created Secret name to reuse externally-managed credentials.
      existingSecret: ""
      # Key within the user's existingSecret holding the non-superuser password.
      secretKeys:
        userPasswordKey: password
    primary:
      service:
        ports:
          postgresql: 5432
      persistence:
        size: 50Gi
    # Additional Bitnami values can be set here or via --set / -f overrides.

# -----------------------------------------------------------------------------
# In-chart Redis (set redis.enabled=false to use an external Redis)
# -----------------------------------------------------------------------------
redis:
  enabled: true
  image:
    repository: redis
    # 7.2.x is the last BSD-3-Clause Redis line (7.4+ is RSALv2/SSPL). Pinned by
    # index digest; the air-gap build pulls this digest (NOTICE, W0.38).
    tag: "7.2.16-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  # Match docker-compose defaults: AOF on, 512MB cap, noeviction (a full Redis rejects writes loudly; it holds queues and dedup state, so it must never silently evict).
  args:
    - --appendonly
    - "yes"
    - --maxmemory
    - 512mb
    - --maxmemory-policy
    - noeviction
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  external:
    # Full Redis URL (e.g. redis://:password@redis.example.com:6379/0).
    # If set, this wins over in-chart Redis.
    url: ""
    existingSecret: ""
    existingSecretKey: REDIS_URL

  # Bitnami redis subchart (issue #114). When enabled, suppresses the MVP
  # in-chart Redis and routes REDIS_URL at the subchart's -master service.
  #
  # Prerequisites (ONE-TIME):
  #   helm dependency update infra/helm/vigil
  #
  # See https://artifacthub.io/packages/helm/bitnami/redis
  bitnami:
    enabled: false
    fullnameOverride: ""   # default: <release>-redis, with service <release>-redis-master
    architecture: standalone   # "replication" for HA
    auth:
      enabled: true
      # Leave empty to let the subchart generate a password.
      existingSecret: ""
      existingSecretPasswordKey: redis-password
    master:
      persistence:
        size: 5Gi

# -----------------------------------------------------------------------------
# Database init Job
# -----------------------------------------------------------------------------
# Runs the SQL files under infra/database/init/ in an explicit order to avoid the
# 003_* filename collision. Uses helm hooks to run on install + upgrade.
dbInit:
  enabled: true
  image:
    # Uses the same image as Postgres so psql is available.
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  # A file that fails (on a first install: its tables are the backend's
  # create_all tables, e.g. cases for 50_regulatory_clocks.sql) is not recorded.
  # After setting the vigil_app password the Job waits up to this long for the
  # backend's tables, retries those files, and leaves the rest to the next
  # upgrade. Counts against `helm install --timeout` (hooks included).
  appSchemaWaitSeconds: 180
  # Explicit ordering — files added under infra/database/init/ will NOT auto-run.
  # Update this list when new init SQL lands, in filename order (the order
  # compose applies them); tests/unit/_ratchets/test_helm_db_init_sql_files.py
  # fails until you do.
  sqlFiles:
    - 01_init_schema.sql
    - 04_config_tables.sql
    - 05_case_management_extended.sql
    - 06_auth_tables.sql
    - 07_custom_agents.sql
    - 07_skills.sql
    - 08_custom_workflows.sql
    - 09_llm_providers.sql
    - 10_ai_model_configs.sql
    - 11_custom_agent_component_category.sql
    - 12_workflow_runs.sql
    - 13_approval_actions.sql
    - 14_threat_indicators.sql
    - 15_federation.sql
    - 16_llm_budgets.sql
    - 17_loglm_setup.sql
    - 18_agent_decision_ids.sql
    - 19_agent_ledger.sql
    - 20_agent_directives.sql
    - 21_agent_run_leases.sql
    - 22_workflow_run_deleted.sql
    - 23_drop_finding_embedding.sql
    - 24_finding_mitre_predictions.sql
    - 25_nullable_finding_score_timestamp.sql
    - 26_episodic_memory.sql
    - 27_episodic_read_log.sql
    - 28_case_closure_actor.sql
    - 29_episodic_distil_failures.sql
    - 30_approval_action_reversibility.sql
    - 30_vigil_app_role.sql
    - 31_agent_ledger_hash_chain.sql
    - 32_drop_attack_layers.sql
    - 33_episodic_verdict_techniques.sql
    - 34_drop_skills.sql
    - 34_mcp_credentials.sql
    - 35_ip_exclusions.sql
    - 36_workflow_runs_triggered_by_index.sql
    - 37_workflow_runs_outcome.sql
    - 38_custom_agent_fallback_model.sql
    - 39_case_findings_finding_index.sql
    - 40_drop_custom_workflow_graph_layout.sql
    - 41_users_service_account.sql
    - 42_medic_last_seen.sql
    - 43_medic_permissions.sql
