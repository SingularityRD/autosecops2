# -----------------------------------------------------------------------------
# Database backup CronJob (docs/operations/rpo-rto.md)
# -----------------------------------------------------------------------------
# pg_dump -Fc of the platform database on a schedule. Each dump is checked
# with pg_restore --list and gets a .sha256 before it is kept. Retention keeps
# the newest keepLast dumps and deletes older ones past retentionDays (0 = keep
# only keepLast). Optionally each new dump is copied to an S3-compatible
# bucket; expire objects there with a bucket lifecycle rule.
backup:
  enabled: false
  schedule: "17 2 * * *"   # daily 02:17 UTC; the RPO is this interval
  image:
    # pg_dump must be at least the server's major version.
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  keepLast: 14
  retentionDays: 30
  # libpq sslmode for the dump connection.
  sslMode: prefer
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Also archive the case evidence store on every run, when evidence.persistence
  # is enabled (nothing to archive otherwise):
  # evidence-<stamp>.tar.gz beside the dump, same retention, uploaded with it.
  # Restored case_evidence rows point at these files. false: the database only,
  # and backing up the evidence claim is the operator's job.
  includeEvidence: true
  persistence:
    # false: dumps live only in the object store (objectStore.enabled required).
    enabled: true
    existingClaim: ""
    size: 50Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  objectStore:
    enabled: false
    image:
      repository: amazon/aws-cli
      tag: "2.17.0"
      pullPolicy: IfNotPresent
    bucket: ""
    prefix: vigil-backups
    # Non-AWS stores (MinIO, Ceph RGW): the S3 endpoint URL.
    endpointUrl: ""
    region: ""
    # Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Empty: the pod's
    # own identity (IRSA / workload identity) is used.
    existingSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# LLM stack: Bifrost (the one LLM egress, ADR 0011) and Ollama (W0.55)
# -----------------------------------------------------------------------------
# Off by default: the chart then expects Services "bifrost" and "ollama" in the
# namespace (config.BIFROST_URL / config.OLLAMA_URL), as the air-gap installer
# provides from k8s/llm-stack.yaml. Turned on, the chart runs them itself and
# points BIFROST_URL / OLLAMA_URL at its own Services. Bifrost serves an
# unauthenticated config API on its inference port, so with
# networkPolicies.enabled only this release's pods may reach it.
llmStack:
  bifrost:
    enabled: false
    image:
      repository: maximhq/bifrost
      # A contract with the backend; keep in step with BIFROST_IMAGE_TAG in
      # infra/docker/docker-compose.yml and k8s/llm-stack.yaml.
      tag: v2.2.1
      pullPolicy: IfNotPresent
    # An existing Secret whose keys ANTHROPIC_API_KEY, OPENAI_API_KEY and
    # GEMINI_API_KEY (any of them) seed those providers on first boot. Empty:
    # no cloud provider is seeded; add one later in the console.
    providerKeysSecret: ""
    # Bifrost v2 downloads pricing and model-parameter catalogs from
    # getbifrost.ai at start-up and exits without them. true (or
    # networkPolicies.egress.inClusterOnly) seeds empty catalogs instead:
    # Bifrost then starts offline and reports no per-token cost.
    offlineCatalog: false
    # Cloud providers seeded from providerKeysSecret.
    providers:
      - anthropic
      - openai
      - gemini
    persistence:
      size: 1Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  ollama:
    enabled: false
    image:
      repository: ollama/ollama
      tag: "0.6.5"
      pullPolicy: IfNotPresent
    # Models are pulled by an operator (`ollama pull` in the pod) or copied in;
    # a request never triggers a pull.
    persistence:
      size: 40Gi
      storageClassName: ""
    # e.g. limits: {nvidia.com/gpu: 1} with a matching nodeSelector/tolerations.
    resources:
      requests:
        cpu: "1"
        memory: 8Gi
      limits:
        memory: 16Gi
    nodeSelector: {}
    tolerations: []

# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: vigil.local
      paths:
        # Subdirectory deploys (e.g. /vigil) must set config.VIGIL_CONTEXT_PATH
        # to the same string; the chart does not derive one from the other.
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: vigil-tls
    #   hosts:
    #     - vigil.example.com

# -----------------------------------------------------------------------------
# OpenShift (preview)
# -----------------------------------------------------------------------------
# OpenShift's restricted-v2 SCC assigns each namespace its own uid range and
# refuses pods that ask for a fixed uid or fsGroup. With enabled: true the chart
# leaves runAsUser, runAsGroup and fsGroup out of every pod so the SCC fills
# them in; the images keep their writable paths group-0 writable for that.
# The bundled PostgreSQL and Redis images expect their own uids: on OpenShift
# use an external database and Redis (postgresql.enabled=false with
# postgresql.external, redis.enabled=false with redis.external).
# Not yet verified on a live OpenShift cluster.
openshift:
  enabled: false
  route:
    # A Route to the backend Service, in place of (or beside) the Ingress.
    enabled: false
    host: ""
    annotations: {}
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

# -----------------------------------------------------------------------------
# Service account
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# -----------------------------------------------------------------------------
# State Directory
# -----------------------------------------------------------------------------
# Where AutoSecOps keeps what the database does not: MCP enable flags, detection
# sources. Exported as VIGIL_DIR to the backend, daemon and llm-worker. Secrets
# entered in the Settings UI are not here: with config.SECRETS_BACKEND
# "database" they are encrypted rows in PostgreSQL.
#
# The emptyDir default is per-pod and cleared on restart, deliberately: a
# ReadWriteOnce disk cannot be shared by backend.replicaCount > 1, and
# ReadWriteMany is not available on every cluster.
#
# For durability on a cluster with ReadWriteMany storage:
#   stateDirectory.volume:
#     persistentVolumeClaim:
#       claimName: vigil-state
stateDirectory:
  mountPath: /var/lib/vigil
  volume:
    emptyDir: {}

# -----------------------------------------------------------------------------
# Case evidence store
# -----------------------------------------------------------------------------
# Files attached to cases (the /hunt document and other evidence) are written to
# <stateDirectory.mountPath>/evidence.
#
# WARNING: OFF by default, and then evidence is NOT persistent. It lives in the
# State Directory volume, an emptyDir by default, and is lost whenever a pod is
# restarted or rescheduled; it is also per pod, so with two backend replicas an
# attachment exists only on the replica that took it. The case_evidence rows in
# Postgres survive and point at files that are gone. Turn it on for any install
# that keeps evidence.
#
# enabled: true mounts a persistent claim at that path in the backend, daemon
# (retention) and llm-worker pods (and the backup job, backup.includeEvidence).
# podSecurityContext.fsGroup (1000) makes it writable by the app. Every one of
# those pods mounts it and they may run on different nodes, so it must be
# ReadWriteMany: set accessModes [ReadWriteMany] and a storageClassName that
# provides it (NFS, CephFS, Longhorn RWX, EFS / Azure Files / Filestore ...), or
# an existingClaim. accessModes is required; ReadWriteOnce is refused at
# template time whenever more than one pod mounts the claim.
#
# The chart-created claim carries helm.sh/resource-policy: keep, so
# `helm uninstall` leaves the evidence in place.
#
# Deferred: keep evidence in Postgres or the object store instead of a shared
# filesystem (docs/wp/w0.26.md, option d).
evidence:
  persistence:
    enabled: false
    existingClaim: ""
    size: 20Gi
    storageClassName: ""
    # Required when enabled, e.g. [ReadWriteMany].
    accessModes: []

# -----------------------------------------------------------------------------
# Custom CA bundle (TLS-inspecting proxies)
# -----------------------------------------------------------------------------
# Mount an operator-supplied PEM into backend, daemon, llm-worker, agent-worker,
# and agent-serve, and set SSL_CERT_FILE, REQUESTS_CA_BUNDLE, and
# NODE_EXTRA_CA_CERTS to that path. Python and Node then trust the inspecting
# CA with verification still enabled. MCP children inherit the same vars.
# SSL_CERT_FILE replaces the default store — the PEM should include public CAs
# as well as the inspecting one. NODE_EXTRA_CA_CERTS appends.
#
# This trusts the CA for every host AutoSecOps calls. For a private CA that signs one
# self-hosted server (a Wazuh indexer, an internal Splunk, MISP, PAN-OS or
# VStrike), set that integration's "CA Certificate Path" in Settings, or
# <INTEGRATION>_CA_CERT_PATH (e.g. ELASTIC_SIEM_CA_CERT_PATH) via extraEnv,
# instead: that PEM is trusted for that integration's clients only. The file
# must be readable in the backend and daemon pods; this block does not mount it.
#
# Point at an existing Secret or ConfigMap — this chart does not create one.
# Leave both names empty (the default) to skip the mount. Prefer the Secret
# when both are set.
#
#   kubectl create secret generic vigil-proxy-ca \
#     --from-file=ca.crt=/path/to/corporate-ca.pem
#
#   caBundle:
#     existingSecret: vigil-proxy-ca
#     key: ca.crt
caBundle:
  existingSecret: ""
  existingConfigMap: ""
  key: ca.crt
  mountPath: /etc/vigil/ca-bundle.pem

# -----------------------------------------------------------------------------
# Pod security
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# -----------------------------------------------------------------------------
# Signing keys (W0.36)
# -----------------------------------------------------------------------------
# Ed25519 keys for the signed audit checkpoints (daemon) and the case evidence
# packs (backend). With generate on, the first install mints each into its own
# Secret (<fullname>-signing-key-checkpoint for the daemon, -evidence for the
# backend); upgrades keep them (read back with lookup) and `helm uninstall`
# leaves them (helm.sh/resource-policy: keep). A key also present in
# secrets.existingSecret / ExternalSecrets wins over the minted one. The values
# are never in values.yaml or the release notes. Export the public keys for the
# auditor after install:
#   kubectl exec statefulset/<fullname>-daemon -- python -m core.audit.signing_keys export
#   kubectl exec deploy/<fullname>-backend -- python -m core.audit.signing_keys export
# Where lookup cannot run (helm template, Argo CD, Flux) every render would mint
# new keys: create one Secret yourself with both keys
# (AUDIT_CHECKPOINT_SIGNING_KEY, EVIDENCE_PACK_SIGNING_KEY) and name it in
# existingSecret, or supply them through secrets.existingSecret / ExternalSecrets
# with generate=false. Without a key the backend's /api/health lists a warning.
signingKeys:
  generate: true
  existingSecret: ""

# Data-encryption key (VIGIL_DATA_KEY, W0.34): encrypts the MFA secrets and the
# console secrets kept in PostgreSQL (SECRETS_BACKEND=database). generate=true
# mints one into the Secret <fullname>-data-key on first install and keeps it on
# every upgrade and on uninstall (helm.sh/resource-policy: keep): losing it makes
# every stored secret unreadable, so back it up with the database. A key in
# secrets.dataEncryptionKey, secrets.existingSecret or an ExternalSecret wins.
# Where lookup cannot run (helm template, Argo CD, Flux) every render would mint
# a new key: create the Secret yourself (key VIGIL_DATA_KEY, 32+ characters) and
# name it in existingSecret.
dataKey:
  generate: true
  existingSecret: ""

# -----------------------------------------------------------------------------
# Secrets (plain values — skipped if existingSecret is set)
# -----------------------------------------------------------------------------
# Reference a pre-created secret instead of templating values here.
# The secret must define keys matching env vars (ANTHROPIC_API_KEY, POSTGRES_PASSWORD, …).
secrets:
  existingSecret: ""

  # ExternalSecrets Operator (issue #113) — declares an ExternalSecret that
  # materializes the K8s Secret from an external store (AWS SM, Vault, etc).
  # When enabled, the plain secret.yaml template is skipped.
  externalSecret:
    enabled: false
    refreshInterval: 1h
    # SecretStore or ClusterSecretStore reference
    secretStoreRef:
      name: ""
      kind: ClusterSecretStore
    # Either .data (explicit per-key mapping) or .dataFrom (pull the whole
    # remote secret and use every key as-is).
    # .data example:
    #   data:
    #     ANTHROPIC_API_KEY:
    #       remoteRef:
    #         key: vigil/prod/anthropic-api-key
    #     POSTGRES_PASSWORD:
    #       remoteRef:
    #         key: vigil/prod/postgres
    #         property: password
    data: {}
    # .dataFrom example:
    #   dataFrom:
    #     - extract:
    #         key: vigil/prod/all-secrets
    dataFrom: []

  # Required (at least one of these must be set for the backend to do useful work).
  anthropicApiKey: ""

  # DB password. Materialized as POSTGRES_PASSWORD; db-init and app pods
  # consume the discrete POSTGRES_* parts, not an assembled DSN.
  postgresPassword: "change-me-before-production"

  # Required when DEV_MODE=false (see env.example). Generate with:
  #   python -c "import secrets; print(secrets.token_urlsafe(64))"
  jwtSecretKey: ""

  # Data-encryption key (VIGIL_DATA_KEY). The backend does not start without
  # one when DEV_MODE=false; leave this empty and dataKey.generate (above) mints
  # and keeps one. Set it to bring your own. It encrypts the secrets entered in the
  # console, which SECRETS_BACKEND=database keeps in PostgreSQL (shared by every
  # replica, kept across restarts), and the users' MFA (TOTP) secrets. It is not
  # the JWT key: rotating jwtSecretKey only ends sessions. Keep a copy outside
  # the cluster; losing it loses those secrets. At least 32 characters:
  #   openssl rand -base64 32
  # Rotation ("new,old" for one rollout, then "new"): admin guide, Sır döndürme.
  dataEncryptionKey: ""

  # Shared secret the agent worker presents on the /internal endpoints. Required
  # to run a workflow: without it every /internal call answers 503. The worker
  # must be given the same value. Generate with:
  #   python -c "import secrets; print(secrets.token_urlsafe(48))"
  agentInternalToken: ""

  # One-time setup token for creating the first administrator (W0.33). Leave it
  # empty and the backend generates one on first start: read it with
  #   kubectl logs -n <ns> -l app.kubernetes.io/component=backend --prefix | grep "setup token"
  # or issue a fresh one with
  #   kubectl exec -n <ns> deploy/<release>-backend -c backend -- python -m core.auth.setup_token regenerate
  # Set it (24+ characters) only when automation creates the first admin. It is
  # ignored once an account exists.
  setupToken: ""

  # Optional data-source integrations.
  splunkPassword: ""
  crowdstrikeClientId: ""
  crowdstrikeClientSecret: ""
  elasticApiKey: ""
  elasticPassword: ""
  criblPassword: ""
  darktraceWebhookSecret: ""
  vstrikeApiKey: ""
  vstrikeInboundApiKey: ""

  # Optional threat-intel.
  virustotalApiKey: ""
  shodanApiKey: ""
  alienvaultOtxApiKey: ""
  joeSandboxApiKey: ""
  capeSandboxApiKey: ""

  # Notifications.
  slackBotToken: ""
  pagerdutyRoutingKey: ""
  teamsWebhookUrl: ""

  # Cloud.
  awsAccessKeyId: ""
  awsSecretAccessKey: ""
  githubToken: ""

  # Email.
  smtpPassword: ""

  # Kafka SASL (optional).
  kafkaSaslPassword: ""

  # Multi-provider LLM (issue #88 / post-merge additions)
  openaiApiKey: ""

# -----------------------------------------------------------------------------
# Non-secret config (rendered into a ConfigMap)
# -----------------------------------------------------------------------------
config:
  # Development Mode — MUST be false in production.
  DEV_MODE: "false"

  # Secrets / auth policy. "database": secrets entered in the console are
  # Fernet-encrypted with secrets.dataEncryptionKey and kept in PostgreSQL
  # (platform_secrets), so both backend replicas see them and they survive a
  # restart. Nothing is written to the State Directory (an emptyDir).
  SECRETS_BACKEND: "database"
  ENABLE_KEYRING: "false"
  AUTH_LOCKOUT_THRESHOLD: "5"
  AUTH_LOCKOUT_DURATION_MINUTES: "15"
  AUTH_MIN_PASSWORD_LENGTH: "12"
  AUTH_PASSWORD_HISTORY_LIMIT: "5"
  PASSWORD_RESET_TTL_SECONDS: "3600"
  # FIPS 140-3 mode: needs a FIPS-enabled image (see the chart README, "FIPS
  # modu"). With a standard image and "true" every pod exits at startup.
  FIPS_MODE: "false"
  # Blank = bcrypt, or pbkdf2_sha256 when FIPS_MODE is "true".
  PASSWORD_HASH_SCHEME: ""
  # Include the context path under a subdirectory (e.g. https://example.com/vigil).
  VIGIL_FRONTEND_URL: ""

  # Email backend
  VIGIL_EMAIL_BACKEND: "console"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_TLS: "true"
  SMTP_FROM: "noreply@autosecops.local"

  # HTTP security headers + CORS
  VIGIL_CORS_ORIGINS: ""
  # Sub-directory the app is served under (e.g. "/vigil"). Empty = root.
  # Must match ingress path; the chart does not derive one from the other.
  # The reverse proxy must forward the prefix unchanged.
  VIGIL_CONTEXT_PATH: ""
  VIGIL_HSTS_ENABLED: "true"
  VIGIL_HSTS_MAX_AGE: "31536000"
  VIGIL_FRAME_OPTIONS_ENABLED: "true"
  VIGIL_CONTENT_TYPE_OPTIONS_ENABLED: "true"
  VIGIL_REFERRER_POLICY_ENABLED: "true"
  VIGIL_CSP_ENABLED: "true"
  VIGIL_CSP_POLICY: ""

  # CSRF
  VIGIL_CSRF_ENABLED: "true"
  # Enforced (W0.13 R5): a mismatched or missing X-CSRF-Token on a POST, PUT,
  # PATCH or DELETE is refused with 403, not just logged. The web console
  # always sends it. A script calling a non-exempt path with a Bearer token
  # must send a csrf_token cookie and an equal X-CSRF-Token header (any
  # random value), or its prefix must be added below. Set "true" to go back
  # to log-only while you check the API logs for "CSRF violation".
  VIGIL_CSRF_REPORT_ONLY: "false"
  # Added to the always-exempt set (webhooks, ingestion, the /mcp surface,
  # the agent layer's /internal endpoints) rather than replacing it.
  # App-root relative; the API prefixes each entry with VIGIL_CONTEXT_PATH.
  VIGIL_CSRF_EXEMPT_PATHS: "/api/webhooks/,/api/ingest/"

  # Auth cookies
  VIGIL_COOKIE_SECURE: "true"
  VIGIL_COOKIE_SAMESITE: "strict"

  # Integrations — non-secret URLs/usernames
  SPLUNK_URL: ""
  SPLUNK_USERNAME: ""
  SPLUNK_VERIFY_SSL: "true"
  CROWDSTRIKE_BASE_URL: "https://api.crowdstrike.com"
  ELASTIC_SIEM_ELASTICSEARCH_URL: ""
  ELASTIC_SIEM_KIBANA_URL: ""
  ELASTIC_SIEM_USERNAME: ""
  ELASTIC_SIEM_VERIFY_SSL: "true"
  ELASTIC_SIEM_INDEX_PATTERN: ".alerts-security.alerts-default"
  DARKTRACE_ENABLED: "false"
  DARKTRACE_URL: ""
  DARKTRACE_MAX_BODY_KB: "1024"
  VSTRIKE_BASE_URL: ""
  VSTRIKE_VERIFY_SSL: "true"

  # Sandbox
  JOE_SANDBOX_ENABLED: "false"
  JOE_SANDBOX_URL: "https://jbxcloud.joesecurity.org/api"
  CAPE_SANDBOX_ENABLED: "false"
  CAPE_SANDBOX_URL: ""
  HYBRID_ANALYSIS_ENABLED: "false"
  ANYRUN_ENABLED: "false"
  SANDBOX_AUTO_SUBMIT: "false"
  SANDBOX_MAX_FILE_SIZE_MB: "100"
  SANDBOX_ALLOWED_FILE_TYPES: "exe,dll,doc,docx,xls,xlsx,pdf,js,vbs,ps1,bat,msi"
  SANDBOX_ANALYSIS_TIMEOUT: "300"
  SANDBOX_POLL_INTERVAL: "60"

  # Notifications non-secret
  SLACK_DEFAULT_CHANNEL: "#soc-alerts"

  # AWS region (non-secret)
  AWS_REGION: "us-east-1"

  # Daemon behaviour
  DAEMON_WEBHOOK_ENABLED: "true"
  DAEMON_WEBHOOK_PORT: "8081"
  DAEMON_AUTO_TRIAGE: "true"
  DAEMON_AUTO_ENRICH: "true"
  DAEMON_ENRICH_MAX_INFLIGHT: "50"
  # Output-token ceiling for one daemon triage reply (thinking models need room).
  DAEMON_TRIAGE_MAX_TOKENS: "8192"
  DAEMON_HANDOFF_QUEUE_MAXSIZE: "1000"
  # W0.12: findings the webhook acknowledged but has not stored yet; full =>
  # 503 + Retry-After. The directory is per pod (daemon-statefulset.yaml).
  DAEMON_INGEST_SPOOL_MAX_FINDINGS: "10000"
  DAEMON_INGEST_SPOOL_MAX_MB: "128"
  DAEMON_AUTO_RESPONSE: "true"
  DAEMON_CONFIDENCE_THRESHOLD: "0.90"
  DAEMON_REVIEW_THRESHOLD: "0.85"
  DAEMON_MONITOR_THRESHOLD: "0.70"
  DAEMON_CRITICAL_ACTION_FLOOR: "0.70"
  DAEMON_HIGH_ACTION_FLOOR: "0.80"
  # A lock, not the mode. "true" holds every response action for a person and
  # the console cannot choose Act (the regulated-sector setting). "false"
  # leaves the choice to Settings, whose default is Assist: a person approves
  # every response action until an admin chooses Act and raises an autonomy
  # tier (W0.32).
  DAEMON_FORCE_APPROVAL: "false"
  DAEMON_DRY_RUN: "false"
  DAEMON_ESCALATION_ENABLED: "true"
  DAEMON_ESCALATE_SEVERITIES: "critical,high"
  DAEMON_SLACK_ENABLED: "true"
  DAEMON_SLACK_CHANNEL: "#soc-alerts"
  DAEMON_PAGERDUTY_ENABLED: "false"
  DAEMON_THREAT_HUNT_INTERVAL: "86400"
  # Ages out only the episodic read log; findings and processed events are
  # kept until an admin deletes them.
  DAEMON_CLEANUP_RETENTION_DAYS: "90"
  DAEMON_METRICS_ENABLED: "true"
  DAEMON_METRICS_PORT: "9090"
  DAEMON_HEALTH_PORT: "9091"
  DAEMON_LOG_LEVEL: "INFO"

  # Autonomous orchestrator
  ORCHESTRATOR_ENABLED: "false"
  ORCHESTRATOR_LOOP_INTERVAL: "60"
  ORCHESTRATOR_MAX_AGENTS: "3"
  ORCHESTRATOR_MAX_ITERATIONS: "50"
  ORCHESTRATOR_MAX_COST: "5.0"
  ORCHESTRATOR_MAX_RUNTIME: "3600"
  ORCHESTRATOR_MAX_HOURLY_COST: "20.0"
  ORCHESTRATOR_STALE_THRESHOLD: "300"
  ORCHESTRATOR_WORKDIR: "/app/data/investigations"
  ORCHESTRATOR_DRY_RUN: "false"

  # OTEL — disabled by default; turn on when an OTEL collector is reachable.
  VIGIL_OTEL_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_TRACES_SAMPLER: "parentbased_always_on"
  # Agent-layer spans carry prompts, responses and tool I/O only when this is on.
  # They hold customer logs and IOCs, so leave it off outside development.
  VIGIL_OTEL_CAPTURE_CONTENT: "false"

  # Guarded reader (W0.30): hunt/adjudicate/verdict tool results are read by a
  # tool-less reader model and the decider sees typed findings, never text the
  # subject wrote. One extra model call per tool result; "off" shows raw rows.
  AUTOSECOPS_GUARDS: "on"

  # Kafka — disabled by default
  KAFKA_ENABLED: "false"
  KAFKA_BOOTSTRAP_SERVERS: ""
  KAFKA_CONSUMER_GROUP: "vigil-soc"
  KAFKA_TOPICS: ""
  KAFKA_AUTO_OFFSET_RESET: "latest"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"
  KAFKA_SASL_MECHANISM: ""
  KAFKA_SASL_USERNAME: ""
  KAFKA_SSL_CA_LOCATION: ""
  KAFKA_MAX_POLL_RECORDS: "500"
  KAFKA_SESSION_TIMEOUT_MS: "30000"

  # Python
  PYTHONUNBUFFERED: "1"

  # Multi-provider LLM (non-secret defaults; per-provider config is stored
  # per-row in llm_provider_configs after first boot).
  BIFROST_URL: "http://bifrost:8080"
  OLLAMA_URL: "http://ollama:11434"

# Additional ad-hoc env entries merged into every pod. Useful for site-specific
# settings that don't warrant a top-level config key.
extraConfig: {}

# -----------------------------------------------------------------------------
# Observability (issue #112, #115)
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# OTEL Collector subchart (issue #115)
# -----------------------------------------------------------------------------
# Optional, provides an in-cluster OTLP endpoint so backend + daemon don't
# need external observability infra. Values here are passed through to the
# upstream open-telemetry/opentelemetry-collector chart (aliased as otelCollector).
#
# Prerequisites (ONE-TIME):
#   helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
#   helm dependency update infra/helm/vigil
#
# When enabled, the chart auto-rewrites OTEL_EXPORTER_OTLP_ENDPOINT in the
# app ConfigMap to the in-cluster Collector service. You still need to flip
# config.VIGIL_OTEL_ENABLED=true to actually emit telemetry.
otelCollector:
  enabled: false
  mode: deployment
  replicaCount: 1
  # Upstream chart requires image.repository to be set explicitly.
  image:
    repository: otel/opentelemetry-collector-contrib
  # Default pipeline dumps everything to stdout for debugging — swap in
  # Jaeger / Prometheus / Datadog exporters once the collector is producing data.
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]

observability:
  # Prometheus Operator ServiceMonitor — requires the monitoring.coreos.com
  # CRD to be installed on the cluster (Prometheus Operator / kube-prometheus-stack).
  # Daemon must also have config.VIGIL_OTEL_ENABLED=true to actually serve
  # metrics; otherwise scrapes will fail with connection refused.
  serviceMonitor:
    enabled: false
    # Namespace to deploy the ServiceMonitor into. Empty = Release namespace.
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels applied to the ServiceMonitor — set these to match your
    # Prometheus instance's serviceMonitorSelector. Common pattern for
    # kube-prometheus-stack: release: kube-prometheus-stack
    labels: {}
    relabelings: []
    metricRelabelings: []
    # W0.51: also scrape the backend's /metrics (port http). It carries the
    # audit export, backup and HTTP request metrics. /metrics is served without
    # a login: keep it off the public ingress (see the operations guide).
    backend: true
  # W0.51: alert rules (Prometheus Operator PrometheusRule CRD). The metrics
  # exist with config.VIGIL_METRICS_ENABLED=true (local only, no OTEL export,
  # the air-gap default) or with OTEL on.
  prometheusRule:
    enabled: false
    namespace: ""
    labels: {}
  # W0.51: a Grafana dashboard as a ConfigMap for the Grafana sidecar
  # (label grafana_dashboard: "1" by default).
  grafanaDashboard:
    enabled: false
    namespace: ""
    labels:
      grafana_dashboard: "1"

# -----------------------------------------------------------------------------
# NetworkPolicies (issue #111)
# -----------------------------------------------------------------------------
# Off by default — flipping to true on an existing cluster may break traffic
# that was previously implicitly allowed. Plan the rollout.
networkPolicies:
  enabled: false
  # Namespace selector used to allow ingress traffic from the ingress
  # controller's namespace. Defaults match a common nginx-ingress install;
  # adjust if your controller runs elsewhere or lives in the same namespace.
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
  daemon:
    # CIDRs allowed to POST to the daemon's webhook port. Empty list means
    # cluster-internal only. Add your SIEM/EDR outbound IPs here to let them
    # push findings.
    webhookAllowFrom: []
  agentServe:
    # agent-serve answers chat and run projections, and its probes ride the same
    # port. Ingress rules are OR'd, so allowing probes from any namespace also
    # opens that port to every pod in the cluster — leaving the bearer token as
    # the only gate (ADR 0014).
    #
    # True by default because a kubelet probe comes from the node, not a pod, and
    # whether a CNI lets that past a pod-selector rule varies; a probe blocked by
    # policy takes the Deployment down. Set false on Calico or Cilium, which
    # permit node-sourced health checks — then only the backend can reach it.
    allowProbesFromAnyNamespace: true
  egress:
    # false (default): the "-deny-all" policy allows all egress, because the
    # backend and daemon call external APIs. true: only in-cluster pods (any
    # namespace, kube-dns included) plus extraCIDRs -- the air-gapped profile
    # (infra/airgap/values-airgap.yaml). Needs networkPolicies.enabled.
    inClusterOnly: false
    # ipBlock CIDRs allowed in addition when inClusterOnly is true, e.g. NodeLocal
    # DNSCache ("169.254.20.10/32") or an on-prem SIEM the daemon polls.
    extraCIDRs: []

# -----------------------------------------------------------------------------
# Medic — the install's own ops-health watcher (System Watcher). Off by default.
# -----------------------------------------------------------------------------
# Observe-only: it reads pods, logs and the agent worker's /readyz, and reaches
# the backend only through its read-only gateway (a separate pod). Everything it
# renders carries its own labels, not the chart's selector pair, so the chart's
# NetworkPolicies never select it, and its own policies render whatever
# networkPolicies.enabled says.
#
# It needs a cluster that ENFORCES NetworkPolicy (Calico, Cilium, a managed
# cluster with policy enforcement on, kind's kindnet since it gained policy
# support). At start it connects to the gateway (allowed) and then tries a
# connection its policy blocks (see below). Unless the first connects and the
# second is dropped (or refused three times, for plugins set to REJECT), it
# exits with code 3 and says why, and the pod crash-loops: on flannel or any
# plugin without policy support it will not run.
# Known limits:
#   - Cilium matches ipBlock against node/host addresses only with
#     policy-cidr-match-mode=nodes; without it, an API server on node IPs is
#     unreachable from Medic.
#   - NodeLocal DNSCache (169.254.20.10) isn't covered by `dns` below; Medic
#     can't resolve names there and refuses to start.
#   - kubeApi.cidrs looked up at install are pinned: if the API server's
#     addresses change (EKS rotates its ENIs), run `helm upgrade` again.
#   - IPv6-only clusters aren't supported yet (the gateway binds IPv4).
medic:
  enabled: false
  image:
    repository: ""   # empty → <registry>/<namespace>-medic
    tag: ""          # empty → .Chart.AppVersion
    pullPolicy: ""
  # 1 vCPU / 1 GiB is the hard ceiling; Medic's pass bar is half that.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # The decision store (medic.db). One writer, so one replica and Recreate.
  # `helm uninstall` keeps the claim; delete it by hand to drop the history.
  persistence:
    enabled: true          # false → emptyDir: history is lost on every restart
    size: 2Gi
    storageClassName: ""   # empty → the cluster default
    accessModes:
      - ReadWriteOnce      # ReadWriteOncePod where the storage driver has it
  # The NetworkPolicy probe is not configurable: Medic connects to the gateway's
  # outbound listener (<fullname>-medic-gateway:8471, allowed) and then tries
  # its inbound one on the same Service (<fullname>-medic-gateway:8470, which
  # Medic's policy blocks; only the backend may reach the inbound listener).
  # One Service, one EndpointSlice: both have endpoints or neither does.
  # X-Medic-Key (X2): the shared secret the backend presents, through the
  # gateway's inbound listener, to Medic's API (one poll a minute; Down after
  # 270 s without an answer). Minted at install into <fullname>-medic-api-key
  # (32 random bytes, base64url) and kept across upgrades; never put a key here.
  # Medic and the backend mount it as a file. Where `lookup` can't run (helm
  # template, Argo CD, Flux) every render mints a new one, so create the Secret
  # yourself and name it, e.g.
  #   kubectl create secret generic medic-api-key --from-file=api_key=<(
  #     python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
  apiKey:
    existingSecret: ""
    key: api_key
  # Where Medic reads the agent worker's /readyz. Empty → a Service this chart
  # renders for it (<fullname>-medic-agent-worker:6990). Needs
  # agentWorker.enabled: the egress policy allows only the chart's agent worker.
  agentWorkerAddr: ""
  # The Kubernetes API server's address(es), as CIDRs, for Medic's egress policy
  # (TCP `ports` only). Filled at install by looking up the `kubernetes`
  # endpoints; set by hand where lookup can't run (`helm template`, Argo CD,
  # Flux), e.g. from `kubectl get endpointslice kubernetes -n default`.
  kubeApi:
    cidrs: []
    ports: [443, 6443]
  # Where Medic and the gateway resolve names.
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

  # The read-only gateway: Medic's only path to the backend (an exact list of
  # GETs), and the backend's path to Medic's API.
  gateway:
    image:
      repository: ""   # empty → <registry>/<namespace>-medic-gateway
      tag: ""
      pullPolicy: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    # The Viewer account the gateway logs in as. Required when medic.enabled.
    # The password comes from an existing Secret, mounted as a file; it is
    # never put in this file or in any pod's environment.
    viewer:
      username: ""
      passwordSecret:
        name: ""
        key: password
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}

