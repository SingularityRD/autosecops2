# AutoSecOps staging overrides for infra/helm/vigil (single VM, k3s).
#
# Applied by infra/staging/nightly.sh as:
#   helm upgrade --install autosecops infra/helm/vigil -n autosecops-staging \
#     -f infra/staging/values-staging.yaml \
#     -f /etc/autosecops-staging/secrets.yaml \        # generated on the VM, 0600
#     --set global.imageRegistry=... --set backend.image.tag=<sha12> ...
#
# NO SECRETS IN THIS FILE. postgresPassword / jwtSecretKey / agentInternalToken /
# dataEncryptionKey
# live in /etc/autosecops-staging/secrets.yaml, written once by bootstrap.sh.
# Image registry, namespace and tags are set per run by nightly.sh.
#
# Differences from a production install, on purpose:
#   - auth ON (DEV_MODE=false) so the smoke test exercises real login;
#   - response actions OFF and dry-run ON: demo/replay data must never trigger
#     isolation, blocking or paging;
#   - plain HTTP behind k3s Traefik (no TLS) -> insecure cookies;
#   - one replica of everything, small requests sized for a 4 vCPU / 16 GB VM.

fullnameOverride: autosecops

global:
  imagePullPolicy: IfNotPresent

backend:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1536Mi

daemon:
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1536Mi
  persistence:
    size: 2Gi

llmWorker:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

agentWorker:
  replicaCount: 1

agentServe:
  replicaCount: 1

postgresql:
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

redis:
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

# k3s ships Traefik as its ingress controller. nightly.sh sets the host from
# STAGING_HOST (e.g. 203.0.113.7.sslip.io).
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: autosecops-staging.local
      paths:
        - path: /
          pathType: Prefix

config:
  DEV_MODE: "false"
  VIGIL_COOKIE_SECURE: "false"
  VIGIL_HSTS_ENABLED: "false"
  VIGIL_EMAIL_BACKEND: "console"

  # Triage on (the smoke test waits for it), response off.
  DAEMON_AUTO_TRIAGE: "true"
  DAEMON_AUTO_ENRICH: "true"
  DAEMON_AUTO_RESPONSE: "false"
  DAEMON_DRY_RUN: "true"
  DAEMON_FORCE_APPROVAL: "true"
  DAEMON_ESCALATION_ENABLED: "false"
  DAEMON_SLACK_ENABLED: "false"
  DAEMON_PAGERDUTY_ENABLED: "false"
  ORCHESTRATOR_ENABLED: "false"
  ORCHESTRATOR_DRY_RUN: "true"

  # Served by infra/staging/manifests/llm.yaml in the same namespace.
  BIFROST_URL: "http://bifrost:8080"
  OLLAMA_URL: "http://ollama:11434"

extraConfig:
  # Sweep for untriaged findings every minute instead of every five, so the
  # smoke test's single finding is picked up quickly.
  DAEMON_ENRICH_BACKFILL_INTERVAL: "60"
